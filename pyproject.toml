[build-system]
requires = ["setuptools>=70.3.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyz-strata"
authors = [{ name = "Vincent Huybrechts", email = "vincent@huybrechts.xyz" }]
license = { text = "AGPL-3.0-or-later" }
description = "Python infrastructure platform for managing VM workspaces and clusters to deploy and maintain an automated container orchestration platform."
readme = "README.md"
keywords = [
    "infrastructure",
    "platform",
    "orchestration",
    "containers",
    "automation",
]
urls = { Homepage = "https://github.com/huybrechtsxyz/strata", Repository = "https://github.com/huybrechtsxyz/strata", Issues = "https://github.com/huybrechtsxyz/strata/issues" }
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",             # Comment-preserving round-trip YAML (strata versions lock/refresh)
    "python-hcl2>=8.0",
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "requests>=2.31",
    "jinja2>=3.1",
    "jmespath>=1.0",
    "paramiko>=3.0",
    "scp>=0.14",
    "cyclonedx-python-lib>=7.0,<12",
    "packageurl-python>=0.11,<2",
    # Logging - Standard libraries
    "structlog>=24.0",                             # Structured logging (replaces python-json-logger)
    "colorama>=0.4; platform_system == 'Windows'", # Required by structlog.dev.ConsoleRenderer(colors=True) on Windows
    "opentelemetry-api>=1.20",                     # OpenTelemetry API
    "opentelemetry-sdk>=1.20",                     # OpenTelemetry SDK
    "azure-monitor-opentelemetry>=1.0",            # Azure Application Insights
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { file = "VERSION.txt" }

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"strata.data" = ["*.yaml", "*.txt", "help/*.md", "diagrams/*.yaml"]
"strata.templates" = [
    "*.yaml",
    "*.json",
    "*.md",
    "*.txt",
    "solution/**/*",
    "solution/**",
    "examples/**/*",
    "examples/**",
]

[dependency-groups]
dev = [
    "debugpy",
    "ruff",
    "mypy",
    "import-linter",
    "nox",
    "pytest",
    "pytest-asyncio==1.4.0",
    "pytest-cov",
    "yamllint",
    "pyyaml > 3.13",
    "types-PyYAML",
    "sqlalchemy>=2.0",
    "authlib>=1.3",
    "types-jmespath",
]
doc = [
    "sphinx",
    "sphinx-autoapi",
    "sphinx-toggleprompt",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "myst_parser",
    "coverage-badge",
    "anybadge",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "authlib>=1.3"]
server-postgres = ["psycopg[binary]>=3.1"]
server-mssql = ["pyodbc>=5.0"]
[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
    "src/strata/data/help", # markdown help docs — not Python, never format
    "src/strata/templates", # scaffold templates — may contain non-Python files
    "docs",                 # Sphinx docs — RST/MD, not Python
]
line-length = 120
indent-width = 4
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "N"]
ignore = ["E402", "F841", "E203", "E302", "E305", "E501", "N815"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
norecursedirs = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore:Field name \"validate\" in \"ProviderLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"ResourceLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"WorkspaceLifecycleModel\".*:UserWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "strata"
exclude_type_checking_imports = "True"

[[tool.importlinter.contracts]]
name = "Layered architecture (ADR-0003)"
type = "layers"
layers = [
    "strata.server",
    "strata.commands",
    "strata.controllers",
    "strata.builders | strata.deployers",
    "strata.validators",
    "strata.services",
    "strata.integrations",
    "strata.models",
    "strata.utils",
]

[project.scripts]
strata = "strata.cli:main"
