# ===============================================================================
# Script Name   : ci-release.yaml
# Author        : Vincent Huybrechts
# Version       : 1.0.0
# Python Version: 3.13+
# Description   : Creates a GitHub Release from the dist artifact produced by
#                 ci-build.yaml (artifacts as store pattern), then builds and
#                 pushes a versioned Docker image to GHCR.
#                 Triggered on tag push vX.Y.Z.
# ===============================================================================

name: "CI Release"

# Restrict to least privilege; contents: write required to create a GitHub Release
permissions:
  contents: write
  actions: read # required to download artifacts from ci-build
  packages: write # required to push to GHCR
  id-token: write # required for PyPI trusted publishing (OIDC)

# Never cancel an in-progress release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default shell for all run steps
defaults:
  run:
    shell: bash

# Environment variables
env:
  CI: "true"
  PYTHON_VERSION: "3.13"

# Trigger on push of a tag matching vX.Y.Z
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Create GitHub Release and attach the Python package from ci-build
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find-run.outputs.run_id }}

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v7

      # Look up the successful ci-build run for this exact commit so we can
      # download the dist artifact it produced (artifacts as store pattern).
      - name: Find ci-build run for this commit
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=ci-build.yml \
            --commit="${{ github.sha }}" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful ci-build run found for commit ${{ github.sha }}"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found ci-build run: $RUN_ID"

      # Download the dist/ artifact stored by ci-build
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      # Download the SBOM artifact stored by ci-build and place in dist/ so
      # softprops/action-gh-release picks it up via files: dist/*
      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      # Download the VS Code extension .vsix so it is included in the release
      - name: Download vsix artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: List dist contents
        run: ls -lh dist/

      # Create the GitHub Release and attach every file from dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Publish Python package to PyPI via Trusted Publishing (OIDC)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release.outputs.run_id }}

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # ---------------------------------------------------------------------------
  # Job 3: Publish VS Code extension to the Marketplace
  # ---------------------------------------------------------------------------
  publish-vscode:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download vsix artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release.outputs.run_id }}

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath dist/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # ---------------------------------------------------------------------------
  # Job 4: Build and push the CLI Docker image to GHCR
  # ---------------------------------------------------------------------------
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release # only publish if the GitHub Release succeeded

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-compliant tags and labels from the git tag
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/strata
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build multi-stage CLI image and push; pass the tag as VERSION build arg
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Job: Build and push the state-service server Docker image to GHCR (ADR-0065)
  # ---------------------------------------------------------------------------
  publish-server:
    name: Build and push server image (GHCR)
    runs-on: ubuntu-latest
    needs: release # only publish if the GitHub Release succeeded

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-compliant tags and labels from the git tag
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/strata-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build multi-stage server image and push; pass the tag as VERSION build arg
      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Job 3: Build and push CLI Docker image to Docker Hub
  # ---------------------------------------------------------------------------
  publish-hub-cli:
    name: Publish CLI image to Docker Hub
    runs-on: ubuntu-latest
    needs: release
    if: vars.REGISTRY_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/strata
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Job 4: Build and push docs static site image to Docker Hub
  # ---------------------------------------------------------------------------
  publish-hub-docs:
    name: Publish docs image to Docker Hub
    runs-on: ubuntu-latest
    needs: release
    if: vars.REGISTRY_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/strata-docs
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docs
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Job: Build and push server image to Docker Hub (ADR-0065)
  # ---------------------------------------------------------------------------
  publish-hub-server:
    name: Publish server image to Docker Hub
    runs-on: ubuntu-latest
    needs: release
    if: vars.REGISTRY_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/strata-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
